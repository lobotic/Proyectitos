    <rect x="366" y="182" width="28" height="34" rx="4" fill="#e6e6e6" stroke="#b38f00" stroke-width="2"/>
    <rect x="366" y="192" width="28" height="12" fill="#e05a2b"/>
    <rect x="336" y="228" width="88" height="28" rx="6" fill="#ffffff"/>
