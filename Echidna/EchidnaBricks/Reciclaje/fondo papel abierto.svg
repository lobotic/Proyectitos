  <!-- Envases (amarillo) -->
  <g>
    <path d="M325,140 L435,140 L430,300 L330,300 Z" fill="#f5c400" stroke="#b38f00" stroke-width="3" stroke-linejoin="round"/>
    <rect x="320" y="122" width="120" height="22" rx="6" fill="#b38f00"/>
